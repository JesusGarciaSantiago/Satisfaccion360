<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruleta de Premios</title>
  <link rel="stylesheet" href="./CSS/ruleta.css" />
  <link rel="stylesheet" href="./CSS/footer.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="images/favicon.png" type="image/png">
</head>

<body class="ruleta">
  <!-- Logo en la parte superior -->
  <div class="logo-header">
    <img src="./images/logo C50_Inverted.png" alt="Logo Carranza 50" class="logo-top">
  </div>

  <main class="contenedor">
    <h1>¡Gracias por tu respuesta!</h1>

    <div class="instruccion">
      <p>¡Gira la ruleta y GANA un premio!*</p>
      <small>
        *Aplican términos y condiciones
        <button id="btn-terminos" class="btn-link-terminos">Ver términos</button>
      </small>
    </div>

    <div class="ruleta-container">
      <!-- Decoración alrededor de la ruleta -->
      <div class="ruleta-decoration">
        <div class="sparkle sparkle-1">✨</div>
        <div class="sparkle sparkle-2">✨</div>
        <div class="sparkle sparkle-3">✨</div>
        <div class="sparkle sparkle-4">✨</div>
      </div>

      <canvas id="canvas" width="500" height="500"></canvas>

      <!-- Flecha indicadora mejorada -->
      <div class="arrow-indicator">▼</div>

      <div id="boton-central" class="boton-central">
        <span class="girar-text">GIRAR</span>
      </div>
    </div>

    <div id="resultado"></div>

    <!-- Popup sin botón "Cambiar Usuario" -->
    <div id="popup-premio" class="hidden">
      <div class="popup-content">
        <div class="confetti-container">
          <div class="confetti">🎉</div>
          <div class="confetti">🎊</div>
          <div class="confetti">✨</div>
          <div class="confetti">🎁</div>
        </div>

        <h2>¡Ganaste!</h2>
        <p id="mensaje-premio"></p>

        <div id="loader-pdf" class="loader-container">
          <div class="spinner"></div>
          <p>Generando tu premio...</p>
        </div>

        <!-- QR (inicialmente oculto) -->
        <div id="premio-generado" class="hidden">
          <div id="qr-popup-code"></div>
          <p style="font-size: 0.9rem; color: #666; margin-top: 10px;">Escanea el código para descargar tu premio</p>
        </div>

        <div class="popup-buttons">
          <button onclick="continuar()">Continuar</button>
        </div>
      </div>
    </div>

    <!-- 🆕 MODAL DE TÉRMINOS Y CONDICIONES -->
    <div id="modal-terminos" class="modal-terminos hidden">
      <div class="modal-terminos-content">
        <button class="btn-cerrar-modal" id="btn-cerrar-terminos">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <h2>📋 Términos y Condiciones</h2>
        <div class="terminos-imagen-container">
          <img src="./images/terminos-condiciones.png" alt="Términos y Condiciones" class="terminos-imagen">
        </div>
      </div>
    </div>
  </main>

  <!-- Footer (solo botón Home) -->
  <footer class="bottom-nav">
    <div class="nav-item" id="btn-home" aria-label="Inicio">
      <i class="fa-solid fa-house"></i>
    </div>
  </footer>

  <!-- Audio de ruleta -->
  <audio id="sonido-ruleta" preload="auto">
    <source src="./sounds/ruleta.mp3" type="audio/mpeg">
  </audio>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="./JS/ruleta.js"></script>
  <script src="./JS/footer.js"></script>

  <!-- 🆕 Script para modal de términos -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btnTerminos = document.getElementById('btn-terminos');
      const modalTerminos = document.getElementById('modal-terminos');
      const btnCerrarTerminos = document.getElementById('btn-cerrar-terminos');

      if (btnTerminos && modalTerminos) {
        btnTerminos.addEventListener('click', (e) => {
          e.preventDefault();
          modalTerminos.classList.remove('hidden');
          document.body.style.overflow = 'hidden';
        });
      }

      if (btnCerrarTerminos && modalTerminos) {
        btnCerrarTerminos.addEventListener('click', () => {
          modalTerminos.classList.add('hidden');
          document.body.style.overflow = '';
        });

        // Cerrar al hacer clic fuera del modal
        modalTerminos.addEventListener('click', (e) => {
          if (e.target === modalTerminos) {
            modalTerminos.classList.add('hidden');
            document.body.style.overflow = '';
          }
        });
      }
    });
  </script>

</body>

</html>
